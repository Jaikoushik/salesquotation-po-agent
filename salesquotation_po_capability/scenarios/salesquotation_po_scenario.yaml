description: >
  Create and manage Purchase Orders in SAP S/4HANA from sales quotation details:
  lookup suppliers, validate products and materials, draft Purchase Orders,
  and post Purchase Orders via OData V4.
  Triggers on: "create a purchase order", "create purchase order", "create po",
  "new purchase order", "new po", "convert sales quotation to purchase order",
  "convert quotation to po", "create po from quotation", "create purchase order from sales quotation",
  "purchase order from quote", "lookup supplier", "search supplier", "find supplier",
  "lookup product", "search material", "find product", "order materials",
  "draft purchase order", "draft po", "post purchase order", "post po",
  "approve", "reject", "confirm", "proceed", "yes", "ok".

target:
  name: salesquotation_po_function
  type: function
  parameters:
    - name: agent_context_id
      value: $capability_context.agent_context_id
    - name: agent_task_id
      value: $capability_context.agent_task_id

capability_context:
  - name: agent_context_id
    value: $target_result.agent_context_id
  - name: agent_task_id
    value: $target_result.agent_task_id
