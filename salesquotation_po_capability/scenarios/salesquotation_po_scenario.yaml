description: >
  Generate SAP S/4HANA Purchase Orders from supplier quote documents: upload vendor quotation PDFs,
  extract pricing and line items with AI, match vendor and parts, and issue Purchase Orders.
  Triggers on: "create purchase order from quote", "generate purchase order from vendor quotation",
  "upload supplier quotation", "upload vendor quote", "upload quotation document", "upload quotation pdf",
  "parse vendor quote", "extract quote details", "convert quote to purchase order", "convert quote to po",
  "purchase order from quote", "po from supplier quotation", "issue purchase order from quotation",
  "approve", "reject", "confirm", "proceed", "yes", "ok".

target:
  name: salesquotation_po_function
  type: function
  parameters:
    - name: agent_context_id
      value: $capability_context.agent_context_id
    - name: agent_task_id
      value: $capability_context.agent_task_id

capability_context:
  - name: agent_context_id
    value: $target_result.agent_context_id
  - name: agent_task_id
    value: $target_result.agent_task_id
